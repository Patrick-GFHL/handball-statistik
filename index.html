<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Handball-Statistik</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HB-Statistik">
<style>
:root{
  --bg:#f3f4f6;--card:#fff;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;
  --pri:#1d4ed8;--pri2:#dbeafe;--g:#15803d;--g2:#dcfce7;--b:#b91c1c;--b2:#fee2e2;
  --y:#a16207;--y2:#fef9c3;--n:#374151;--n2:#f3f4f6;--r:#7f1d1d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff;color:var(--ink)}
.hidden{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;gap:8px;padding:6px 2px 12px}
header.top h1{font-size:20px;margin:0;flex:1}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--g)}
.dot.busy{background:var(--y)}.dot.local{background:var(--mute)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:14px}
.btn{background:var(--pri);color:#fff;padding:12px 16px;font-weight:600}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.ghost{background:transparent;color:var(--pri);padding:8px 10px}
.btn.danger{background:var(--b2);color:var(--b)}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;background:none;padding:10px 0 12px;color:var(--mute);font-size:12px;border-radius:0}
nav.tabs button b{display:block;font-size:20px;line-height:1.2}
nav.tabs button.on{color:var(--pri);font-weight:600}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--n2);color:var(--n);font-weight:600}
.badge.live{background:var(--b2);color:var(--b)}
.score{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border-radius:10px;background:var(--pri2);color:var(--pri);font-weight:800}
.num.tw{background:var(--y2);color:var(--y)}
.list .item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
label.chk{display:flex;align-items:center;gap:10px;padding:8px 0}
label.chk input{width:22px;height:22px}
.seg{display:flex;background:var(--n2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;background:none;padding:8px;border-radius:8px;font-size:14px;color:var(--n)}
.seg button.on{background:#fff;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.1)}
/* Live */
.live-head{position:sticky;top:0;z-index:4;background:var(--ink);color:#fff;margin:-12px -12px 10px;padding:calc(10px + env(safe-area-inset-top)) 12px 12px}
.live-head .back{background:rgba(255,255,255,.12);color:#fff;padding:8px 12px}
.big-score{font-size:40px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:1px}
.teams{display:flex;justify-content:space-between;font-size:13px;opacity:.8;padding:0 6px}
.clock{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.clock .t{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:110px;text-align:center}
.clock button{background:rgba(255,255,255,.15);color:#fff;padding:8px 12px;font-size:14px}
.clock button.go{background:var(--g)}
.gk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media(min-width:520px){.gk{grid-template-columns:repeat(4,1fr)}}
.act{padding:14px 6px;font-weight:700;font-size:15px;border-radius:12px;min-height:54px}
.act.g{background:var(--g2);color:var(--g)}.act.b{background:var(--b2);color:var(--b)}
.act.y{background:var(--y2);color:var(--y)}.act.r{background:#fecaca;color:var(--r)}
.act.n{background:var(--n2);color:var(--n)}
.act:active{transform:scale(.97)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{background:#fff;border-radius:14px;padding:10px 6px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.08);min-height:86px}
.tile .n{font-size:28px;font-weight:800;color:var(--pri);line-height:1.1}
.tile.tw .n{color:var(--y)}
.tile .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .mini{font-size:11px;color:var(--mute);margin-top:2px}
.tile.susp{outline:3px solid var(--y)}
.tile.gkt{background:var(--y2)}
.bench .tile{background:#f9fafb;opacity:.85}
.subm .tile{outline:2px dashed var(--pri);outline-offset:-2px}
.sec-t{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;margin:12px 2px 6px}
.subbar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;position:sticky;top:calc(var(--headh,0px));z-index:3}
.subbar.on{background:var(--pri);color:#fff}
.subbar.on .btn{background:#fff;color:var(--pri)}
.ptr{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.ptn{width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptb{flex:1;display:flex;height:14px;background:var(--n2);border-radius:7px;overflow:hidden}
.ptb i{display:block;background:var(--pri);height:100%}.ptb i.g{background:#eab308}
.ptv{width:70px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.ptv small{color:var(--mute);font-weight:400}
.wrap.live{max-width:1280px}
.live-head .lh-row{display:flex;flex-direction:column;gap:6px}
.live-head .lh-row .back{align-self:flex-start}
@media(min-width:700px){
  .live-head .lh-row{flex-direction:row;align-items:center;gap:16px}
  .live-head .lh-score{flex:1}
  .live-head .lh-clock{flex:1.4}
  .live-head .lh-clock .clock{justify-content:flex-end}
}
.subbar .hint{font-size:13px;opacity:.75}
@media(max-width:699px){.subbar .hint{display:none}}
.live-main{display:flex;flex-direction:column;gap:12px;margin-top:10px}
@media(min-width:700px){.live-main{flex-direction:row;align-items:flex-start}.court-col{flex:1;min-width:0}.bench-col{width:min(300px,32vw);position:sticky;top:10px}}
.court{position:relative;aspect-ratio:200/115;width:100%;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.15);touch-action:manipulation}
.court svg{position:absolute;inset:0;width:100%;height:100%}
.chip{--cs:clamp(54px,9vw,88px);width:var(--cs);min-height:calc(var(--cs)*.92);background:#fff;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:4px 3px;box-shadow:0 2px 6px rgba(0,0,0,.25);user-select:none;-webkit-user-select:none;cursor:grab;touch-action:none;line-height:1.1}
.court .chip{position:absolute;transform:translate(-50%,-50%)}
.chip b{font-size:calc(var(--cs)*.34);color:var(--pri)}
.chip.tw b{color:var(--y)}
.chip.gkchip{background:var(--y2)}
.chip .cn{font-size:clamp(10px,1.5vw,13px);font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .cm{font-size:clamp(9px,1.2vw,11px);color:var(--mute);white-space:nowrap}
.chip.empty{background:rgba(255,255,255,.18);border:2px dashed rgba(255,255,255,.8);color:#fff;font-weight:700;box-shadow:none;cursor:default}
.chip.susp{outline:3px solid #eab308}
.chip.sel{outline:4px solid var(--pri);outline-offset:1px}
.chip.dragging{opacity:.35}
.chip.drop-hl,.bench-col.drop-hl,.court.drop-hl{outline:4px solid #f59e0b;outline-offset:1px}
.subm .chip:not(.empty){animation:wig .9s ease-in-out infinite alternate}
@keyframes wig{from{box-shadow:0 2px 6px rgba(0,0,0,.25)}to{box-shadow:0 0 0 3px rgba(29,78,216,.5)}}
.bench-col{background:#fff;border-radius:14px;padding:12px;min-height:120px}
.bench-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--bcs,64px),1fr));gap:8px;justify-items:center}
@media(min-width:700px){.bench-grid{--bcs:80px}}
.bench-grid .chip{--cs:clamp(60px,8vw,84px);background:#f3f4f6;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.gkcard{margin-top:10px;padding:12px}
@media(min-width:700px){
  .sheet{align-items:center}
  .sheet .panel{max-width:560px;border-radius:18px;padding-bottom:18px}
}
.stopped{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:10px;background:#dc2626;color:#fff;border-radius:12px;padding:10px 12px;font-weight:800;letter-spacing:.3px;animation:blink 1.2s ease-in-out infinite}
.stopped button{background:#fff;color:#dc2626;padding:8px 14px;font-weight:800}
@keyframes blink{0%,100%{background:#dc2626}50%{background:#991b1b}}
.tile:active{transform:scale(.97)}
.ev{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev:last-child{border-bottom:0}
.ev .min{width:44px;color:var(--mute);font-variant-numeric:tabular-nums}
.ev .x{background:none;color:var(--mute);padding:4px 8px;font-size:18px}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;font-weight:700}
.pill.g{background:var(--g2);color:var(--g)}.pill.b{background:var(--b2);color:var(--b)}
.pill.y{background:var(--y2);color:var(--y)}.pill.r{background:#fecaca;color:var(--r)}.pill.n{background:var(--n2);color:var(--n)}
/* Sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(17,24,39,.45)}
.sheet .panel{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{font-size:18px;margin:0 0 12px}
.sheet .grid{grid-template-columns:repeat(3,1fr)}
.field{margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
/* Stats */
.tbl-wrap{overflow-x:auto;margin:0 -14px;padding:0 14px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--mute);font-weight:600;cursor:pointer;user-select:none}
th.on{color:var(--pri)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff}
tr.click td:first-child{color:var(--pri);font-weight:600}
.gauges{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:8px}
.gauge{text-align:center}
.gauge svg{width:100%;max-width:120px;display:block;margin:0 auto}
.gauge .gl{font-size:13px;font-weight:600;margin-top:-2px;line-height:1.2}
.gauge .gl small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.kpi{background:#fff;border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:11px;color:var(--mute)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:10px}
.bars .bw{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bars .bar{width:100%;max-width:34px;background:var(--pri);border-radius:6px 6px 0 0;min-height:2px}
.bars .bl{font-size:10px;color:var(--mute);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bars .bv{font-size:11px;font-weight:700;margin-bottom:2px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 12px 10px 16px;border-radius:12px;display:flex;align-items:center;gap:12px;z-index:30;font-size:15px;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast button{background:rgba(255,255,255,.18);color:#fff;padding:6px 10px;font-size:14px}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--bg);z-index:40;color:var(--mute)}
.note{font-size:13px;background:var(--y2);color:var(--y);padding:10px 12px;border-radius:10px;margin-bottom:10px}
</style>
</head>
<body>
<div id="loading" class="loading"><div style="font-size:34px">🤾</div><div>Lade Daten …</div></div>
<div id="app"></div>
<div id="sheet" class="sheet hidden"></div>
<div id="toast" class="hidden"></div>
<script>
"use strict";
/* ---------- Konstanten ---------- */
const EV = {
  goal:{l:'Tor',c:'g'}, miss:{l:'Fehlwurf',c:'b'}, p7goal:{l:'7m Tor',c:'g'}, p7miss:{l:'7m verworfen',c:'b'},
  assist:{l:'Assist',c:'n'}, steal:{l:'Ballgewinn',c:'n'}, block:{l:'Block',c:'n'}, p7drawn:{l:'7m rausgeholt',c:'n'},
  tf:{l:'Techn. Fehler',c:'b'}, yellow:{l:'Gelb',c:'y'}, two:{l:'2 Min',c:'y'}, red:{l:'Rot',c:'r'},
  save:{l:'Parade',c:'g'}, p7save:{l:'7m gehalten',c:'g'}, conceded:{l:'Gegentor',c:'b'},
  in:{l:'↑ Rein',c:'n'}, out:{l:'↓ Raus',c:'n'}, gk:{l:'Torwart',c:'y'},
  to:{l:'Auszeit',c:'r'}, toOpp:{l:'Auszeit Gegner',c:'n'}, oppMiss:{l:'Fehlwurf Gegner',c:'g'}
};
const SUB = {in:1, out:1, gk:1};
const FIELD_ACTIONS = ['goal','miss','tf','p7goal','p7miss','steal','yellow','two','red'];
const LS_KEY = 'hbstats_v1';
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const $ = s => document.querySelector(s);
const defaultTeam = () => ({name:'Meine Mannschaft', halfMin:20, fieldSize:6, fillOnTwo:true, autoClock:true, players:[]});

/* ---------- Zustand ---------- */
const S = {
  team: defaultTeam(), games: {}, deleted: {}, mode: 'local', view: 'games',
  gameId: null, subMode: false, statsScope: 'season', statsGame: '', sort: 'goals', gkSort: 'saves', playerId: null
};
let db = null;
const Q = {};          // Schreib-Warteschlangen je Dokument
let undoTimer = null;

/* ---------- Speicherung ---------- */
function storeLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({team:S.team, games:S.games, deleted:S.deleted})); }catch(e){}
}
function saveLocal(){ storeLocal(); scheduleSync(); }
function loadLocal(){
  try{
    const d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if(d){ S.team = Object.assign(defaultTeam(), d.team || {}); S.games = d.games || {}; S.deleted = d.deleted || {}; return true; }
  }catch(e){}
  return false;
}
function pending(path){ const q = Q[path]; return !!(q && (q.busy || q.next)); }
function save(path, data){
  saveLocal();
  if(S.mode !== 'cloud'){ syncBadge(); return; }
  const q = Q[path] || (Q[path] = {busy:false, next:null});
  q.next = clone(data);
  if(!q.busy) flush(path);
  syncBadge();
}
async function flush(path){
  const q = Q[path]; q.busy = true; syncBadge();
  while(q.next){
    const d = q.next; q.next = null;
    try{ await db.doc(path).set(d); }
    catch(e){
      if(e && e.code === 'unavailable'){ await sleep(800 + Math.random()*1200); if(!q.next) q.next = d; }
      else if(e && e.code === 'quota_exceeded'){ toast('Speicher voll – bitte alte Spiele löschen.'); }
      else if(e && e.code === 'revoked'){ toast('Zugriff entzogen – Daten nur noch lokal.'); S.mode='local'; }
      else { toast('Speichern fehlgeschlagen' + (e && e.message ? ': ' + e.message : '')); }
    }
  }
  q.busy = false; syncBadge();
}
async function removeDoc(path){
  saveLocal();
  if(S.mode === 'cloud'){ try{ await db.doc(path).delete(); }catch(e){ toast('Löschen fehlgeschlagen'); } }
}
const saveTeam = () => { S.team.updatedAt = Date.now(); save('team/main', S.team); };
const saveGame = g => { g.updatedAt = Date.now(); save('games/' + g.id, g); };

function syncBadge(){
  const el = $('#sync'); if(!el) return;
  const busy = Object.keys(Q).some(pending);
  if(S.mode !== 'cloud' && syncCfg){
    const t = lastSync ? new Date(lastSync).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'}) : '';
    if(syncing) el.innerHTML = '<span class="dot busy"></span>synchronisiert …';
    else if(syncErr) el.innerHTML = `<span class="dot" style="background:var(--b)"></span>${navigator.onLine ? 'Sync-Fehler' : 'offline – Abgleich später'}`;
    else if(syncDirty) el.innerHTML = `<span class="dot busy"></span>${navigator.onLine ? 'wartet auf Abgleich' : 'offline – Abgleich später'}`;
    else el.innerHTML = `<span class="dot"></span>abgeglichen ${t}`;
    return;
  }
  if(S.mode !== 'cloud') el.innerHTML = '<span class="dot"></span>offline gespeichert';
  else el.innerHTML = busy ? '<span class="dot busy"></span>speichert …' : '<span class="dot"></span>gespeichert';
}

/* ---------- Abgleich mit privatem GitHub-Repository ---------- */
const SYNC_KEY = 'hbstats_sync', SYNC_FILE = 'handball-daten.json';
let syncCfg = null, syncing = false, syncAgain = false, syncTimer = null, syncErr = '', syncDirty = false, lastSync = 0;
try{ syncCfg = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null'); lastSync = (syncCfg && syncCfg.lastSync) || 0; }catch(e){}
function storeSyncCfg(){ try{ syncCfg ? localStorage.setItem(SYNC_KEY, JSON.stringify(Object.assign(syncCfg, {lastSync}))) : localStorage.removeItem(SYNC_KEY); }catch(e){} }
const b64enc = str => { const b = new TextEncoder().encode(str); let s = ''; for(let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
const b64dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, '')), c => c.charCodeAt(0)));
function stableStr(v){
  if(Array.isArray(v)) return '[' + v.map(stableStr).join(',') + ']';
  if(v && typeof v === 'object') return '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + stableStr(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
function mergeData(a, b){
  const deleted = Object.assign({}, a.deleted || {});
  for(const k in (b.deleted || {})) deleted[k] = Math.max(deleted[k] || 0, b.deleted[k]);
  const games = {};
  for(const src of [a.games || {}, b.games || {}]) for(const id in src){
    const g = src[id]; if(!games[id] || (g.updatedAt || 0) > (games[id].updatedAt || 0)) games[id] = g;
  }
  for(const id in deleted) if(games[id] && (games[id].updatedAt || 0) <= deleted[id]) delete games[id];
  const ta = a.team, tb = b.team;
  const team = !tb ? ta : !ta ? tb : ((ta.updatedAt || 0) >= (tb.updatedAt || 0) ? ta : tb);
  return {team, games, deleted};
}
function ghFetch(cfg, path, opts = {}){
  return fetch('https://api.github.com/repos/' + cfg.repo + path, Object.assign({cache:'no-store'}, opts, {
    headers: Object.assign({'Authorization':'Bearer ' + cfg.token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'}, opts.body ? {'Content-Type':'application/json'} : {})
  }));
}
function httpMsg(st){

function scheduleSync(ms = 8000){

async function syncNow(manual){
  if(!syncCfg) return;
  if(syncing){ syncAgain = true; return; }
  if(!navigator.onLine){ syncErr = 'offline'; syncBadge(); if(manual) toast('Kein Internet – Abgleich folgt automatisch'); return; }
  syncing = true; syncErr = ''; syncBadge();
  const cfg = syncCfg; let changedLocal = false;
  try{
    for(let attempt = 0; attempt < 3; attempt++){
      let remote = {team:null, games:{}, deleted:{}}, sha = null;
      const r = await ghFetch(cfg, '/contents/' + SYNC_FILE);
      if(r.status === 200){ const j = await r.json(); sha = j.sha; const d = JSON.parse(b64dec(j.content)); remote = {team:d.team || null, games:d.games || {}, deleted:d.deleted || {}}; }
      else if(r.status !== 404) throw new Error(httpMsg(r.status));
      // ab hier ohne await bis zur Übernahme: lokale Änderungen gehen nicht verloren
      const before = stableStr({team:S.team, games:S.games, deleted:S.deleted});
      const m = mergeData({team:S.team, games:S.games, deleted:S.deleted}, remote);
      S.team = Object.assign(defaultTeam(), m.team || {}); S.games = m.games; S.deleted = m.deleted;
      const after = stableStr({team:S.team, games:S.games, deleted:S.deleted});
      if(after !== before){ changedLocal = true; storeLocal(); }
      const remoteStr = stableStr({team:remote.team ? Object.assign(defaultTeam(), remote.team) : defaultTeam(), games:remote.games, deleted:remote.deleted});
      syncDirty = false;
      if(after !== remoteStr || !sha){
        const body = JSON.stringify({message:'Daten ' + new Date().toLocaleString('de-DE'), content:b64enc(JSON.stringify({app:'hbstats', v:1, savedAt:new Date().toISOString(), team:S.team, games:S.games, deleted:S.deleted})), ...(sha ? {sha} : {})});
        const pr = await ghFetch(cfg, '/contents/' + SYNC_FILE, {method:'PUT', body});
        if((pr.status === 409 || pr.status === 422) && attempt < 2) continue;   // jemand anderes hat zwischendurch gespeichert
        if(!pr.ok) throw new Error(httpMsg(pr.status));

    }

  syncing = false;

}

async function initStore(){
  let ns = null;
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      ns = await Promise.race([window.claude.use('db'), sleep(10000).then(() => null)]);
    }
  }catch(e){ ns = null; }
  const hadLocal = loadLocal();
  if(!ns){ S.mode = 'local'; done(); return; }
  db = ns; S.mode = 'cloud';
  const localCopy = hadLocal ? {team: clone(S.team), games: clone(S.games)} : null;
  let teamReady = false, gamesReady = false, migrated = false;
  const t = setTimeout(() => { if(!teamReady || !gamesReady){ toast('Server antwortet nicht – zeige letzte lokale Kopie.'); done(); } }, 10000);
  function maybeDone(){
    if(teamReady && gamesReady){
      clearTimeout(t);
      // Einmalige Übernahme lokaler Daten, falls die Cloud noch leer ist
      if(!migrated && localCopy && S.team.players.length === 0 && Object.keys(S.games).length === 0 && localCopy.team.players.length){
        migrated = true;
        S.team = localCopy.team; S.games = localCopy.games;
        saveTeam(); Object.values(S.games).forEach(saveGame);
      }
      done();
    }
  }
  db.doc('team/main').onSnapshot(snap => {
    if(!pending('team/main')) S.team = snap.exists ? Object.assign(defaultTeam(), clone(snap.data())) : (teamReady ? S.team : defaultTeam());
    if(!snap.metadata.fromCache) teamReady = true;
    if(!snap.metadata.hasPendingWrites) { saveLocal(); if(loaded) render(); }
    maybeDone();
  }, err => { toast('Verbindung zum Speicher verloren.'); teamReady = true; maybeDone(); });
  db.collection('games').onSnapshot(qs => {
    const seen = {};
    qs.docs.forEach(d => { seen[d.id] = 1; if(!pending('games/' + d.id)) S.games[d.id] = clone(d.data()); });
    if(!qs.metadata.fromCache){
      Object.keys(S.games).forEach(id => { if(!seen[id] && !pending('games/' + id)) delete S.games[id]; });
      gamesReady = true;
    }
    if(!qs.metadata.hasPendingWrites){ saveLocal(); if(loaded) render(); }
    maybeDone();
  }, err => { toast('Verbindung zum Speicher verloren.'); gamesReady = true; maybeDone(); });
}

const players = () => [...S.team.players].sort((a,b) => (+a.number||999) - (+b.number||999) || a.name.localeCompare(b.name));

const pLabel = id => { const p = pById(id); return p ? `#${p.number} ${p.name}` : (id ? 'Gelöschter Spieler' : 'ohne Zuordnung'); };
const gamesSorted = () => Object.values(S.games).sort((a,b) => (b.date||'').localeCompare(a.date||'') || b.createdAt - a.createdAt);

function clockSec(g){ const c = g.clock; return Math.max(0, Math.floor(c.elapsed + (c.running ? (Date.now() - c.startedAt)/1000 : 0))); }
const fmtClock = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');

function gameLen(g){

/* ---------- Statistik ---------- */
/* Wer steht auf dem Feld? Wird aus den Wechsel-Ereignissen abgeleitet. */
function initState(g){ return {field:new Set(), slots:[], keeper: g.events.some(e => e.type === 'gk') ? null : (g.keeperId || null)}; }
function freeSlot(st){ for(let i = 0; i < st.slots.length; i++) if(!st.slots[i]) return i; return st.slots.length; }
function removeField(st, pid){ st.field.delete(pid); const i = st.slots.indexOf(pid); if(i >= 0) st.slots[i] = null; }
function applySub(st, e){
  if(e.type === 'in'){
    if(st.keeper === e.pid) st.keeper = null;
    if(st.field.has(e.pid)) return;
    st.field.add(e.pid);
    const i = (e.slot != null && e.slot < 20 && !st.slots[e.slot]) ? e.slot : freeSlot(st);
    st.slots[i] = e.pid;
  }
  else if(e.type === 'out'){ removeField(st, e.pid); }
  else if(e.type === 'gk'){ if(e.pid) removeField(st, e.pid); st.keeper = e.pid || null; }
}
function court(g){ const st = initState(g); for(const e of g.events) if(SUB[e.type]) applySub(st, e); return st; }
/* Spielzeit in Sekunden je Spieler: f = Feld, g = Tor. Zählt nur, solange die Uhr läuft. */
function playTime(g){
  const T = {};
  const add = (pid, d, k) => { if(!pid || d <= 0) return; const o = T[pid] || (T[pid] = {f:0, g:0}); o[k] += d; };
  const st = initState(g), hm = S.team.halfMin * 60, now = clockSec(g);
  const halves = [[1, 0, g.clock.half === 1 ? now : (g.clock.h1End != null ? g.clock.h1End : hm)]];
  if(g.clock.half === 2) halves.push([2, hm, Math.max(hm, now)]);
  for(const [h, start, end] of halves){
    let cur = start;
    const step = t => { t = Math.min(Math.max(t, cur), end); const d = t - cur; st.field.forEach(p => add(p, d, 'f')); add(st.keeper, d, 'g'); cur = t; };
    for(const e of g.events){ if(!SUB[e.type] || (e.half || 1) !== h) continue; step(e.t); applySub(st, e); }
    step(end);
  }
  return T;
}
const fmtMin = sec => Math.floor(sec / 60) + '′';
function countsFor(gamesArr){
  const m = {};   // pid -> counts
  for(const g of gamesArr){
    const T = playTime(g);
    const tracked = g.events.some(e => SUB[e.type]);
    for(const pid of (g.lineup || [])){
      const c = m[pid] = m[pid] || {_gp:0};
      const t = T[pid] || {f:0, g:0};
      c._sec = (c._sec || 0) + t.f; c._gks = (c._gks || 0) + t.g;
      if(!tracked || t.f + t.g > 0) c._gp++;
    }
    for(const e of g.events){
      const k = e.pid || '_';
      const c = m[k] = m[k] || {_gp:0};
      c[e.type] = (c[e.type] || 0) + 1;
    }
  }
  return m;
}
function fieldRow(c){
  const g = (c.goal||0) + (c.p7goal||0);
  const shots = g + (c.miss||0) + (c.p7miss||0);
  const p7 = (c.p7goal||0), p7a = p7 + (c.p7miss||0);
  return { gp:c._gp||0, min:Math.floor((c._sec||0)/60), goals:g, shots, q: shots ? g/shots : -1, p7, p7a, assist:c.assist||0,
    tf:c.tf||0, bg:(c.steal||0) + (c.block||0), drawn:c.p7drawn||0,
    two:c.two||0, yellow:c.yellow||0, red:c.red||0 };
}
function gkRow(c){
  const sv = (c.save||0) + (c.p7save||0), ga = c.conceded||0;
  return { gp:c._gp||0, min:Math.floor((c._gks||0)/60), saves:sv, ga, faced:sv+ga, q: (sv+ga) ? sv/(sv+ga) : -1, p7save:c.p7save||0 };
}

function chip(p, zone, T, c, extraCls = '', style = ''){

  const sub = [r.goals ? r.goals + ' T' : '', r.two ? r.two + '×2′' : ''].filter(Boolean).join(' · ');
  return `<div class="chip ${p.tw || zone === 'gk' ? 'tw' : ''} ${extraCls}" data-pid="${p.id}" data-zone="${zone}" style="${style}">
    <b>${esc(p.number)}</b><span class="cn">${esc(p.name)}</span><span class="cm"><span data-pt="${p.id}">${fmtMin(t.f + t.g)}</span>${sub ? ' · ' + sub : ''}</span></div>`;

function renderLive(g){
  const sc = score(g);
  const lineup = (g.lineup || []).map(pById).filter(Boolean).sort((a,b) => (+a.number||999) - (+b.number||999));
  const c = countsFor([g]);
  const st = court(g), T = playTime(g);
  const kOpts = lineup.map(p => `<option value="${p.id}" ${st.keeper===p.id?'selected':''}>#${esc(p.number)} ${esc(p.name)}</option>`).join('');
  const now = clockSec(g);
  const susp = {};
  g.events.forEach(e => { if(e.type === 'two' && e.pid && now - e.t < 120 && now >= e.t && (e.half||1) === g.clock.half) susp[e.pid] = 1; });
  const last = [...g.events].filter(e => !SUB[e.type]).reverse().slice(0, 6);
  const halfLbl = g.clock.half === 1 ? '1. HZ' : '2. HZ';
  const done = g.status === 'done';
  const keeperP = st.keeper ? pById(st.keeper) : null;
  const fs = S.team.fieldSize || 6;
  let slots = st.slots.slice(); while(slots.length > fs && !slots[slots.length - 1]) slots.pop();
  const n = Math.max(fs, slots.length);
  const onCount = st.field.size;
  const bench = lineup.filter(p => !st.field.has(p.id) && p.id !== st.keeper);
  const selCls = id => S.subSel === id ? 'sel' : '';
  let h = `<div class="wrap live" style="padding-top:12px">
  <div class="live-head">
    <div class="lh-row">
      <button class="back" data-a="leaveLive">‹ Zurück</button>
      <div class="lh-score"><div class="big-score">${sc.us} : ${sc.them}</div>
        <div class="teams"><span>${esc(S.team.name)}</span><span>${esc(g.opponent || 'Gegner')}</span></div></div>
      <div class="lh-clock">
        <div class="clock">
        ${done ? '<span class="t">Spielende</span>' : `
          <span class="mute" style="color:#cbd5e1">${halfLbl}</span>
          <span class="t" id="clk">${fmtClock(now)}</span>
          <button class="${g.clock.running?'':'go'}" data-a="clockToggle">${g.clock.running?'⏸ Pause':'▶ Start'}</button>
          <button data-a="half">${g.clock.half===1?'Halbzeit':'Ende'}</button>`}
        </div>
        ${done ? '' : `<div class="clock" style="margin-top:6px"><button data-a="timeout">⏱ Auszeit</button><span style="font-size:13px;color:#cbd5e1">${toInfo(g)}</span></div>`}
      </div>
    </div>
    ${!done && !g.clock.running ? `<div class="stopped"><span>⚠ ACHTUNG – UHR LÄUFT NICHT</span><button data-a="clockToggle">▶ Uhr starten</button></div>` : ''}
    <div class="sync" id="sync" style="color:#94a3b8;justify-content:flex-end"></div>
  </div>`;
  if(done) h += `<div class="note">Spiel ist beendet. Du kannst trotzdem noch Ereignisse nachtragen oder löschen. <button class="btn sm sec" data-a="reopen" style="margin-left:6px">Wieder öffnen</button></div>`;
  if(!lineup.length) return h + `<div class="empty">Keine Spieler im Spielkader. <button class="btn sm sec" data-a="editGame" data-id="${g.id}">Kader wählen</button></div></div>`;
  h += `<div class="subbar ${S.subMode?'on':''}">
      <div class="grow">${S.subMode
        ? '<b>Wechselmodus</b><div style="font-size:13px">Bank antippen, dann den Feldspieler, der rausgeht. Feldspieler allein antippen = raus.</div>'
        : `<b>Feld: ${onCount}/${fs}${keeperP ? ' + TW' : ' – kein TW'}</b><span class="hint"> · Spieler antippen = erfassen · von der Bank auf einen Feldspieler ziehen = wechseln</span>`}</div>
      <button class="btn sm ${S.subMode?'':'sec'}" data-a="subMode">${S.subMode ? '✓ Fertig' : '⇄ Wechselmodus'}</button></div>`;
  if(!onCount && !g.events.some(e => e.type === 'in'))
    h += `<div class="note">Startaufstellung: Spieler von der Bank auf die freien Plätze ziehen (oder Wechselmodus und Bank-Spieler antippen).</div>`;
  h += `<div class="live-main"><div class="court-col">
    <div class="court ${S.subMode?'subm':''}" data-zone="court">${COURT_SVG}`;
  for(let i = 0; i < n; i++){
    const pos = slotPos(i, n), style = `left:${pos.x/2}%;top:${(pos.y-35)/1.15}%`;
    const pid = slots[i];
    if(pid && pById(pid)) h += chip(pById(pid), 'field', T, c, `${susp[pid]?'susp':''} ${selCls(pid)}`, style);
    else h += `<div class="chip empty" data-zone="slot" data-slot="${i}" style="${style}">frei</div>`;
  }
  const gkStyle = 'left:50%;top:78%';
  h += keeperP ? chip(keeperP, 'gk', T, c, `gkchip ${selCls(keeperP.id)}`, gkStyle)
               : `<div class="chip empty gkchip" data-zone="goal" style="${gkStyle}">TW?</div>`;
  h += `</div>
    <div class="card gkcard">
      <div class="row"><span class="mute" style="white-space:nowrap">Im Tor:</span>
        <select data-a="keeper"><option value="">– kein Torwart –</option>${kOpts}</select></div>
      <div class="gk">
        <button class="act g" data-a="gkEv" data-t="save">Parade</button>
        <button class="act g" data-a="gkEv" data-t="p7save">7m gehalten</button>
        <button class="act b" data-a="gkEv" data-t="conceded">Gegentor</button>
        <button class="act n" data-a="oppMiss">Fehlwurf Gegner</button>
      </div></div>
  </div>
  <div class="bench-col" data-zone="bench"><div class="sec-t" style="margin-top:0">Bank (${bench.length})</div><div class="bench-grid">`;
  h += bench.map(p => chip(p, 'bench', T, c, `${susp[p.id]?'susp':''} ${selCls(p.id)}`)).join('') || `<div class="mute" style="padding:8px 2px">Bank ist leer.</div>`;
  h += `</div></div></div>`;
  h += `<div class="card" style="margin-top:10px"><div class="row" style="margin-bottom:4px"><b class="grow">Letzte Ereignisse</b>
    <button class="btn sm ghost" data-a="allEvents">Alle inkl. Wechsel (${g.events.length})</button></div>`;
  h += last.length ? last.map(e => evRow(e)).join('') : `<div class="mute">Noch nichts erfasst.</div>`;
  h += `</div>`;
  if(!done) h += `<button class="btn full danger" data-a="endGame" style="margin-top:6px">Spiel beenden</button>`;
  h += `</div>`;
  return h;
}
function toInfo(g){
  const n = (t, h) => g.events.filter(e => e.type === t && (e.half||1) === h).length;
  const h = g.clock.half;
  return `Auszeiten ${h}. HZ: wir ${n('to', h)} · Gegner ${n('toOpp', h)}`;
}
function evRow(e){
  const d = EV[e.type] || {l:e.type, c:'n'};
  return `<div class="ev"><span class="min">${e.half===2?'2.':'1.'} ${Math.floor(e.t/60)}′</span>
    <span class="pill ${d.c}">${d.l}</span><span class="grow">${e.type==='to' ? esc(S.team.name) : (e.type==='toOpp' || e.type==='oppMiss') ? 'Gegner' : e.type==='gk' && !e.pid ? 'kein Torwart' : esc(pLabel(e.pid))}</span>
    <button class="x" data-a="delEv" data-id="${e.id}" aria-label="Löschen">×</button></div>`;
}

function renderStats(){
  const gs = gamesSorted();
  if(!gs.length) return `<div class="empty">Noch keine Spiele – hier erscheinen die Auswertungen.</div>`;
  const opts = gs.map(g => `<option value="${g.id}" ${S.statsGame===g.id?'selected':''}>${shortDate(g.date)} ${esc(g.opponent)}</option>`).join('');
  const sel = S.statsScope === 'game' ? gs.filter(g => g.id === (S.statsGame || gs[0].id)) : gs;
  if(S.statsScope === 'game' && !S.statsGame) S.statsGame = gs[0].id;
  const c = countsFor(sel);
  let h = `<div class="seg" style="margin-bottom:10px">
    <button data-a="scope" data-v="season" class="${S.statsScope==='season'?'on':''}">Saison</button>
    <button data-a="scope" data-v="game" class="${S.statsScope==='game'?'on':''}">Einzelspiel</button></div>`;
  if(S.statsScope === 'game') h += `<select data-a="statsGame" style="margin-bottom:10px">${opts}</select>`;
  // Team-Kennzahlen
  let tg = 0, ts = 0, ttf = 0, tga = 0, w = 0, l = 0, d = 0;
  for(const g of sel){ const sc = score(g); tga += sc.them; if(g.status==='done'){ if(sc.us>sc.them) w++; else if(sc.us<sc.them) l++; else d++; } }
  Object.keys(c).forEach(k => { const r = fieldRow(c[k]); tg += r.goals; ts += r.shots; ttf += r.tf; });
  h += `<div class="kpis">
    <div class="kpi"><b>${tg}:${tga}</b><span>Tore</span></div>
    <div class="kpi"><b>${ts}</b><span>Würfe</span></div>
    <div class="kpi"><b>${ttf}</b><span>Techn. Fehler</span></div>
    <div class="kpi"><b>${S.statsScope==='season' ? `${w}-${d}-${l}` : sel.length ? (()=>{const s=score(sel[0]);return s.us>s.them?'Sieg':s.us<s.them?'Niederl.':'Remis'})() : ''}</b><span>${S.statsScope==='season'?'S-U-N':'Ergebnis'}</span></div></div>`;
  { let oSv = 0, oGa = 0, oMiss = 0, t7 = 0, t7a = 0;
    for(const g of sel) for(const e of g.events){ if(e.type==='save'||e.type==='p7save') oSv++; else if(e.type==='conceded') oGa++; else if(e.type==='oppMiss') oMiss++;
      if(e.type==='p7goal'){ t7++; t7a++; } else if(e.type==='p7miss') t7a++; }
    const oSh = oSv + oGa + oMiss;
    h += `<div class="card"><b>Quoten Mannschaft</b><div class="gauges">
      ${gauge(tg, ts, 'Wurfquote<small>Tore/Würfe</small>')}
      ${gauge(t7, t7a, '7m-Quote<small>verwandelt</small>')}
      ${gauge(oSv, oSv + oGa, 'Fangquote<small>Paraden/Würfe aufs Tor</small>')}
      ${gauge(oSv + oMiss, oSh, 'Abwehrquote<small>Gegnerwürfe ohne Tor</small>')}
    </div></div>`; }
  if(S.statsScope === 'game' && sel.length){
    const g0 = sel[0], tos = g0.events.filter(e => e.type === 'to' || e.type === 'toOpp');
    if(tos.length) h += `<div class="card"><b>Auszeiten</b>${tos.map(e => `<div class="ev"><span class="min">${(e.half||1)}. ${Math.floor(e.t/60)}′</span><span class="pill ${EV[e.type].c}">${EV[e.type].l}</span><span class="grow"></span><span class="mute">${(() => { const s = score({events: g0.events.slice(0, g0.events.indexOf(e))}); return 'Stand ' + s.us + ':' + s.them; })()}</span></div>`).join('')}</div>`;
  }
  // Spielzeitverteilung
  const ptRows = players().map(p => { const x = c[p.id] || {}; return {p, f:(x._sec||0), g:(x._gks||0), gp:x._gp||0}; }).filter(x => x.f + x.g > 0).sort((a,b) => (b.f+b.g) - (a.f+a.g));
  if(ptRows.length){
    const mx = Math.max(...ptRows.map(x => x.f + x.g));
    h += `<div class="card"><b>Spielzeit</b><div class="mute" style="margin-bottom:8px">${S.statsScope==='season' ? 'Summe Saison, dahinter Ø pro Spiel' : 'Minuten in diesem Spiel'} · <span style="color:var(--pri)">■</span> Feld <span style="color:var(--y)">■</span> Tor</div>` +
      ptRows.map(x => `<div class="ptr"><span class="ptn">#${esc(x.p.number)} ${esc(x.p.name)}</span><span class="ptb"><i style="width:${x.f/mx*100}%"></i><i class="g" style="width:${x.g/mx*100}%"></i></span><span class="ptv">${Math.floor((x.f+x.g)/60)}′${S.statsScope==='season' && x.gp ? ` <small>Ø ${Math.round((x.f+x.g)/60/x.gp)}</small>` : ''}</span></div>`).join('') + `</div>`;
  }
  // Wurfquoten je Spieler
  const qRows = players().map(p => ({p, r: fieldRow(c[p.id] || {})})).filter(x => x.r.shots > 0).sort((a,b) => (b.r.q - a.r.q) || (b.r.shots - a.r.shots));
  if(qRows.length) h += `<div class="card"><b>Wurfquote je Spieler</b><div class="gauges">` +
    qRows.map(({p, r}) => `<div data-a="playerDetail" data-id="${p.id}" style="cursor:pointer">${gauge(r.goals, r.shots, '#' + esc(p.number) + ' ' + esc(p.name))}</div>`).join('') + `</div></div>`;
  const kRows = players().map(p => ({p, r: gkRow(c[p.id] || {})})).filter(x => x.r.faced > 0);
  if(kRows.length) h += `<div class="card"><b>Fangquote Torhüter</b><div class="gauges">` +
    kRows.map(({p, r}) => `<div data-a="playerDetail" data-id="${p.id}" style="cursor:pointer">${gauge(r.saves, r.faced, '#' + esc(p.number) + ' ' + esc(p.name))}</div>`).join('') + `</div></div>`;
  // Feldspieler
  const cols = [['gp','Sp'],['min','Min'],['goals','Tore'],['shots','Würfe'],['q','Quote'],['p7','7m'],['bg','BG'],['tf','TF'],['two','2′']];
  const rows = players().map(p => ({p, r: fieldRow(c[p.id] || {})})).filter(x => x.r.min || x.r.shots || x.r.tf || x.r.assist || x.r.bg);
  rows.sort((a,b) => (b.r[S.sort] - a.r[S.sort]) || (b.r.goals - a.r.goals));
  h += `<div class="card"><b>Feldspieler</b><div class="mute" style="margin-bottom:6px">Spalte antippen zum Sortieren, Name antippen für Details.</div><div class="tbl-wrap"><table><thead><tr><th>Spieler</th>` +
    cols.map(([k,l]) => `<th data-a="sort" data-v="${k}" class="${S.sort===k?'on':''}">${l}</th>`).join('') + `</tr></thead><tbody>`;
  for(const {p, r} of rows){
    h += `<tr class="click"><td data-a="playerDetail" data-id="${p.id}">#${esc(p.number)} ${esc(p.name)}</td><td>${r.gp}</td><td>${r.min}</td><td><b>${r.goals}</b></td><td>${r.shots}</td><td>${r.q<0?'–':Math.round(r.q*100)+'%'}</td><td>${r.p7a?r.p7+'/'+r.p7a:'–'}</td><td>${r.bg}</td><td>${r.tf}</td><td>${r.two}</td></tr>`;
  }
  if(!rows.length) h += `<tr><td colspan="10" class="mute">Keine Daten.</td></tr>`;
  h += `</tbody></table></div><div class="mute" style="margin-top:8px;font-size:12px">Min = Feldspielzeit · BG = Ballgewinne · TF = technische Fehler · 7m = verwandelt/geworfen</div></div>`;
  // Torhüter
  const gkRows = players().map(p => ({p, r: gkRow(c[p.id] || {})})).filter(x => x.r.faced || x.r.min);
  const noGk = gkRow(c['_'] || {});
  if(gkRows.length || noGk.faced){
    gkRows.sort((a,b) => b.r[S.gkSort] - a.r[S.gkSort]);
    h += `<div class="card"><b>Torhüter</b><div class="tbl-wrap"><table><thead><tr><th>Torhüter</th>` +
      [['min','Min'],['saves','Paraden'],['ga','Gegentore'],['q','Quote'],['p7save','7m geh.']].map(([k,l]) => `<th data-a="gkSort" data-v="${k}" class="${S.gkSort===k?'on':''}">${l}</th>`).join('') + `</tr></thead><tbody>`;
    for(const {p, r} of gkRows) h += `<tr class="click"><td data-a="playerDetail" data-id="${p.id}">#${esc(p.number)} ${esc(p.name)}</td><td>${r.min}</td><td><b>${r.saves}</b></td><td>${r.ga}</td><td>${r.q<0?'–':Math.round(r.q*100)+'%'}</td><td>${r.p7save}</td></tr>`;
    if(noGk.faced) h += `<tr><td class="mute">ohne Zuordnung</td><td>–</td><td>${noGk.saves}</td><td>${noGk.ga}</td><td>${noGk.q<0?'–':Math.round(noGk.q*100)+'%'}</td><td>${noGk.p7save}</td></tr>`;
    h += `</tbody></table></div></div>`;
  }
  return h;
}

function renderPlayer(){
  const p = pById(S.playerId);
  if(!p){ S.playerId = null; return renderStats(); }
  const gs = gamesSorted().filter(g => (g.lineup||[]).includes(p.id) || g.events.some(e => e.pid === p.id)).reverse();
  const tot = fieldRow(countsFor(gs)[p.id] || {_gp:0});
  const gk = gkRow(countsFor(gs)[p.id] || {});
  let h = `<button class="btn ghost" data-a="backStats" style="padding-left:0">‹ Statistik</button>
    <div class="card row"><span class="num ${p.tw?'tw':''}" style="width:48px;height:48px;font-size:20px">${esc(p.number)}</span>
    <div class="grow"><div style="font-size:20px;font-weight:700">${esc(p.name)}</div><div class="mute">${tot.gp} Spiele · ${p.tw?'Torwart':'Feldspieler'}</div></div></div>
    <div class="kpis">
      <div class="kpi"><b>${tot.goals}</b><span>Tore</span></div>
      <div class="kpi"><b>${tot.min + gk.min}′</b><span>Spielzeit</span></div>
      <div class="kpi"><b>${tot.shots - tot.goals}</b><span>Fehlwürfe</span></div>
      <div class="kpi"><b>${tot.shots}</b><span>Würfe</span></div>
      <div class="kpi"><b>${tot.bg}</b><span>Ballgew.</span></div>
      <div class="kpi"><b>${tot.tf}</b><span>Techn. F.</span></div>
      <div class="kpi"><b>${tot.gp ? Math.round((tot.min + gk.min)/tot.gp) + '′' : '–'}</b><span>Ø pro Spiel</span></div>
      <div class="kpi"><b>${tot.two}</b><span>2 Min</span></div>
    </div>`;
  { const T = gs.map(g => ({g, t: playTime(g)[p.id] || {f:0, g:0}}));
    const played = T.filter(x => x.t.f + x.t.g > 0);
    const mine = played.reduce((a, x) => a + x.t.f + x.t.g, 0), avail = played.reduce((a, x) => a + gameLen(x.g), 0);
    h += `<div class="card"><b>Quoten</b><div class="gauges">
      ${gauge(tot.goals, tot.shots, 'Wurfquote')}
      ${gauge(tot.p7, tot.p7a, '7m-Quote')}
      ${gauge(mine, avail, 'Spielzeitanteil<small>in seinen Spielen</small>', Math.floor(mine/60) + '/' + Math.floor(avail/60) + ' min')}
      ${gk.faced ? gauge(gk.saves, gk.faced, 'Fangquote') : ''}
    </div></div>`; }
  if(gs.length){
    const per = gs.map(g => ({g, r: fieldRow(countsFor([g])[p.id] || {})}));
    const max = Math.max(1, ...per.map(x => x.r.goals));
    h += `<div class="card"><b>Tore pro Spiel</b><div class="bars">` + per.map(x =>
      `<div class="bw"><div class="bv">${x.r.goals}</div><div class="bar" style="height:${x.r.goals/max*85}%"></div><div class="bl">${shortDate(x.g.date)}</div></div>`).join('') + `</div></div>`;
    h += `<div class="card"><b>Spiele im Detail</b><div class="tbl-wrap"><table><thead><tr><th>Spiel</th><th>Min</th><th>T</th><th>W</th><th>%</th><th>BG</th><th>TF</th><th>2′</th></tr></thead><tbody>` +
      [...per].reverse().map(({g, r}) => `<tr><td>${shortDate(g.date)} ${esc(g.opponent)}</td><td>${r.min + gkRow(countsFor([g])[p.id] || {}).min}</td><td><b>${r.goals}</b></td><td>${r.shots}</td><td>${r.q<0?'–':Math.round(r.q*100)+'%'}</td><td>${r.bg}</td><td>${r.tf}</td><td>${r.two}</td></tr>`).join('') +
      `</tbody></table></div></div>`;
  }
  return h;
}

/* ---------- Sheets / Dialoge ---------- */
function openSheet(html){ const s = $('#sheet'); s.innerHTML = `<div class="panel">${html}</div>`; s.classList.remove('hidden'); }
function closeSheet(){ const s = $('#sheet'); s.classList.add('hidden'); s.innerHTML = ''; }
$('#sheet').addEventListener('click', e => { if(e.target.id === 'sheet') closeSheet(); });
function ask(msg, okLabel = 'Löschen'){
  return new Promise(res => {
    openSheet(`<h2>${esc(msg)}</h2><div class="row"><button class="btn sec grow" id="askNo">Abbrechen</button><button class="btn danger grow" id="askYes">${esc(okLabel)}</button></div>`);
    $('#askNo').onclick = () => { closeSheet(); res(false); };
    $('#askYes').onclick = () => { closeSheet(); res(true); };
  });
}
function toast(msg, undo){
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (undo ? `<button id="undoBtn">Rückgängig</button>` : '');
  t.classList.remove('hidden');
  if(undo) $('#undoBtn').onclick = () => { undo(); t.classList.add('hidden'); };
  clearTimeout(undoTimer); undoTimer = setTimeout(() => t.classList.add('hidden'), undo ? 4000 : 3000);
}

function sheetPlayerEdit(id){
  if(!id) return sheetPlayerNew();
  const p = pById(id);
  openSheet(`<h2>Spieler bearbeiten</h2>
    <div class="row"><label class="field" style="width:90px"><span>Nummer</span><input id="fNum" inputmode="numeric" value="${esc(p.number)}"></label>
    <label class="field grow"><span>Name</span><input id="fName" value="${esc(p.name)}" placeholder="Vorname"></label></div>
    <label class="chk"><input type="checkbox" id="fTw" ${p.tw?'checked':''}> Torwart</label>
    <label class="chk"><input type="checkbox" id="fIn" ${p.inactive?'checked':''}> inaktiv (wird bei neuen Spielen nicht vorausgewählt)</label>
    <button class="btn full" id="fSave" style="margin-top:8px">Speichern</button>
    <button class="btn full danger" id="fDel" style="margin-top:8px">Spieler löschen</button>`);
  $('#fSave').onclick = () => {
    const name = $('#fName').value.trim(), number = $('#fNum').value.trim();
    if(!name){ $('#fName').focus(); return; }
    Object.assign(p, {name, number, tw:$('#fTw').checked, inactive:$('#fIn').checked});
    saveTeam(); closeSheet(); render();
  };
  $('#fDel').onclick = async () => {
    const used = Object.values(S.games).some(g => g.events.some(e => e.pid === id));
    if(await ask(used ? `${p.name} hat erfasste Statistiken. Besser „inaktiv“ setzen. Trotzdem löschen?` : `${p.name} löschen?`)){
      S.team.players = S.team.players.filter(x => x.id !== id); saveTeam(); render();
    }
  };
}
/* Neuer Spieler: Formular bleibt offen für den nächsten */
function sheetPlayerNew(){
  const added = [];
  openSheet(`<h2>Spieler hinzufügen</h2>
    <div class="row"><label class="field" style="width:90px"><span>Nummer</span><input id="fNum" inputmode="numeric" enterkeyhint="next"></label>
    <label class="field grow"><span>Name</span><input id="fName" placeholder="Vorname" enterkeyhint="done"></label></div>
    <label class="chk"><input type="checkbox" id="fTw"> Torwart</label>
    <button class="btn full" id="fNext" style="margin-top:8px">Speichern & nächster</button>
    <button class="btn full sec" id="fDone" style="margin-top:8px">Fertig</button>
    <div id="fAdded" class="mute" style="margin-top:10px"></div>
    <button class="btn ghost" id="fBulk" style="margin-top:4px;padding-left:0">Stattdessen alle als Liste eingeben ›</button>`);
  const focusNum = () => setTimeout(() => { const f = $('#fNum'); if(f) f.focus(); }, 30);
  focusNum();
  const commit = () => {

/* Mehrere Spieler auf einmal: eine Zeile pro Spieler */
function parsePlayerLines(txt){
  const out = [];
  for(let line of txt.split(/\r?\n/)){
    line = line.trim(); if(!line) continue;
    let tw = false;
    line = line.replace(/\(?\b(tw|torwart|torhüter|torhueter|goalie)\b\)?/gi, () => { tw = true; return ' '; });
    line = line.trim();
    let number = '';
    let m = line.match(/^#?\s*(\d{1,3})\s*[.,;:\-–)]?\s+(.*)$/) || line.match(/^(\d{1,3})$/);
    if(m){ number = m[1]; line = m[2] || ''; }
    else if((m = line.match(/^(.*?)[\s,;:\-–(]+#?(\d{1,3})\)?$/))){ line = m[1]; number = m[2]; }
    const name = line.replace(/[,;:\-–]+$/, '').replace(/\s+/g, ' ').trim();
    if(name) out.push({name, number, tw});
  }
  return out;
}

/* Spielaktionen starten eine stehende Uhr automatisch (nicht: Strafen, Wechsel, Auszeiten) */
const AUTO_START = {goal:1, miss:1, p7goal:1, p7miss:1, tf:1, steal:1, save:1, p7save:1, conceded:1, oppMiss:1};
function maybeAutoStart(g, types){
  const c = g.clock;
  if(S.team.autoClock === false || c.running || g.status === 'done' || !types.some(t => AUTO_START[t])) return null;
  const prev = clone(c);
  c.startedAt = Date.now(); c.running = true;
  return prev;
}
function addEvent(g, pid, type){
  const prevClock = maybeAutoStart(g, [type]);
  const base = {half:g.clock.half, t:clockSec(g), at:Date.now()};
  const added = [{id:uid(), pid:pid || null, type, ...base}];
  let suffix = '';
  let fillSlot = null;
  if((type === 'two' || type === 'red') && pid && court(g).field.has(pid)){
    fillSlot = court(g).slots.indexOf(pid);
    added.push({id:uid(), pid, type:'out', ...base}); suffix = ' – vom Feld';
  }
  g.events.push(...added); saveGame(g); render();
  if(fillSlot != null && (type === 'red' || S.team.fillOnTwo !== false)) setTimeout(() => sheetFill(g, pid, fillSlot, type), 0);
  if(navigator.vibrate) try{ navigator.vibrate(30); }catch(_){}
  const who = (type === 'to' || type === 'toOpp') ? fmtClock(base.t) + ' – Uhr angehalten' : type === 'gk' ? (pid ? pLabel(pid) : 'kein Torwart') : (pid ? pLabel(pid) : 'ohne Torwart');
  toast(`${EV[type].l} · ${who}${suffix}${prevClock ? ' · ▶ Uhr gestartet' : ''}`, () => {
    const ids = added.map(x => x.id); g.events = g.events.filter(x => !ids.includes(x.id));
    if(prevClock) g.clock = prevClock;
    saveGame(g); render();
  });
}
function addEvents(g, specs, label){
  const prevClock = maybeAutoStart(g, specs.map(x => x.type));
  const base = {half:g.clock.half, t:clockSec(g), at:Date.now()};
  const added = specs.map(x => Object.assign({id:uid(), ...base}, x));
  g.events.push(...added); saveGame(g); render();
  if(navigator.vibrate) try{ navigator.vibrate(30); }catch(_){}
  toast(label + (prevClock ? ' · ▶ Uhr gestartet' : ''), () => { const ids = added.map(x => x.id); g.events = g.events.filter(x => !ids.includes(x.id)); if(prevClock) g.clock = prevClock; saveGame(g); render(); });
}
const nm = id => { const p = pById(id); return p ? '#' + p.number + ' ' + p.name : '?'; };
function doSwap(g, outId, inId){
  const st = court(g); const slot = st.slots.indexOf(outId);
  addEvents(g, [{pid:outId, type:'out'}, {pid:inId, type:'in', slot}], `Wechsel: ${nm(inId)} ↔ ${nm(outId)}` + (suspendedNow(g)[inId] ? ' – Achtung, Strafe läuft noch!' : ''));
}
function doIn(g, pid, slot){ addEvents(g, [{pid, type:'in', slot: slot == null ? null : slot}], `↑ Rein: ${nm(pid)}` + (suspendedNow(g)[pid] ? ' – Achtung, Strafe läuft noch!' : '')); }
function doOut(g, pid){ addEvents(g, [{pid, type:'out'}], `↓ Raus: ${nm(pid)}`); }
function doGk(g, pid){ addEvents(g, [{pid: pid || null, type:'gk'}], pid ? `Ins Tor: ${nm(pid)}` : 'Kein Torwart'); }

/* Tippen / Ziehen auf dem Spielfeld */
function chipTap(g, d){
  const st = court(g), fs = S.team.fieldSize || 6;
  if(!S.subMode){
    if(d.pid) sheetPlayerActions(g, d.pid);
    else if(d.zone === 'slot' || d.zone === 'goal') toast('Spieler von der Bank hierher ziehen');
    return;
  }
  if(d.zone === 'bench'){
    if(S.subSel === d.pid){ S.subSel = null; render(); return; }
    if(st.field.size < fs && !S.subSel){ doIn(g, d.pid); return; }
    S.subSel = d.pid; render(); return;
  }
  if(d.zone === 'slot'){ if(S.subSel && !st.field.has(S.subSel)){ const p = S.subSel; S.subSel = null; doIn(g, p, +d.slot); } return; }
  if(d.zone === 'field'){
    if(S.subSel && !st.field.has(S.subSel) && S.subSel !== st.keeper){ const p = S.subSel; S.subSel = null; doSwap(g, d.pid, p); }
    else doOut(g, d.pid);
    return;
  }
  if(d.zone === 'gk' || d.zone === 'goal'){
    if(S.subSel){ const p = S.subSel; S.subSel = null; doGk(g, p); }
    else toast('Erst Bank-Spieler antippen, dann ins Tor tippen');
  }
}
function chipDrop(g, d, t){
  if(!t || !d.pid) return;
  const st = court(g);
  if(t.zone === 'bench'){ if(d.zone === 'field') doOut(g, d.pid); else if(d.zone === 'gk') doGk(g, null); return; }
  if(t.zone === 'gk' || t.zone === 'goal'){ if(d.pid !== st.keeper) doGk(g, d.pid); return; }
  if(t.zone === 'field' && t.pid && t.pid !== d.pid){ if(d.zone !== 'field') doSwap(g, t.pid, d.pid); return; }
  if(t.zone === 'slot'){ if(d.zone !== 'field') doIn(g, d.pid, +t.slot); return; }
  if(t.zone === 'court'){ if(d.zone !== 'field') doIn(g, d.pid); }
}
let drag = null;
function clearDropHl(){ document.querySelectorAll('.drop-hl').forEach(x => x.classList.remove('drop-hl')); }
function dropTargetAt(x, y){
  const el = document.elementFromPoint(x, y); if(!el) return null;
  const t = el.closest('.chip, [data-zone]'); if(!t) return null;
  return {el:t, zone:t.dataset.zone, pid:t.dataset.pid || null, slot:t.dataset.slot};
}
document.addEventListener('pointerdown', e => {
  if(S.view !== 'live') return;
  const ch = e.target.closest('.chip'); if(!ch) return;
  drag = {el:ch, pid:ch.dataset.pid || null, zone:ch.dataset.zone, slot:ch.dataset.slot, x:e.clientX, y:e.clientY, moved:false, ghost:null, id:e.pointerId};
});
document.addEventListener('pointermove', e => {
  if(!drag || e.pointerId !== drag.id) return;
  if(!drag.moved){
    if(!drag.pid || Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 10) return;
    drag.moved = true;
    const r = drag.el.getBoundingClientRect();
    const gh = drag.el.cloneNode(true); gh.classList.add('ghost');
    gh.style.cssText = `position:fixed;left:0;top:0;width:${r.width}px;height:${r.height}px;transform:none;margin:0;pointer-events:none;z-index:50`;
    document.body.appendChild(gh); drag.ghost = gh; drag.el.classList.add('dragging');
    drag.dx = r.width / 2; drag.dy = r.height / 2;
  }
  drag.ghost.style.transform = `translate(${e.clientX - drag.dx}px,${e.clientY - drag.dy}px) scale(1.08)`;
  clearDropHl(); const t = dropTargetAt(e.clientX, e.clientY); if(t && t.el !== drag.el) t.el.classList.add('drop-hl');
  e.preventDefault();
}, {passive:false});
function endDrag(e, cancel){
  if(!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if(d.ghost){ d.ghost.remove(); d.el.classList.remove('dragging'); clearDropHl(); }
  const g = S.games[S.gameId]; if(!g || cancel) return;
  if(d.moved) chipDrop(g, d, dropTargetAt(e.clientX, e.clientY)); else chipTap(g, d);
}
document.addEventListener('pointerup', e => endDrag(e, false));
document.addEventListener('pointercancel', e => endDrag(e, true));

function suspendedNow(g){

  g.events.forEach(e => { if(e.type === 'two' && e.pid && now - e.t < 120 && now >= e.t && (e.half||1) === g.clock.half) m[e.pid] = 1; });
  return m;
}

    case 'openLive': S.gameId = id; S.view = 'live'; render(); window.scrollTo(0,0); break;
    case 'gameStats': S.view = 'stats'; S.statsScope = 'game'; S.statsGame = id; S.playerId = null; render(); break;
    case 'leaveLive': S.view = 'games'; S.gameId = null; S.subMode = false; S.subSel = null; $('#toast').classList.add('hidden'); render(); break;
    case 'editPlayer': sheetPlayerEdit(id); break;
    case 'editTeam': sheetTeam(); break;
    case 'export': sheetExport(); break;
    case 'import': sheetImport(); break;
    case 'sync': sheetSync(); break;
    case 'bulkPlayers': sheetPlayerBulk(); break;
    case 'timeout': if(g) sheetTimeout(g); break;
    case 'oppMiss': if(g) addEvents(g, [{pid:null, type:'oppMiss'}], 'Fehlwurf Gegner'); break;
    case 'subMode': S.subMode = !S.subMode; S.subSel = null; render(); break;
    case 'gkEv': if(g){ const k = court(g).keeper; if(!k && el.dataset.t !== 'conceded'){ toast('Bitte erst den Torwart wählen'); break; } addEvent(g, k || null, el.dataset.t); } break;
    case 'delEv': if(g){ const e = g.events.find(x => x.id === id);
      if(e && await ask(`„${EV[e.type].l}“ von ${pLabel(e.pid)} löschen?`)){ g.events = g.events.filter(x => x.id !== id); saveGame(g); render(); if(!$('#sheet').classList.contains('hidden')) sheetAllEvents(g); } } break;
    case 'allEvents': if(g) sheetAllEvents(g); break;
    case 'clockToggle': if(g){ const c = g.clock;
      if(c.running){ c.elapsed = clockSec(g); c.running = false; } else { c.startedAt = Date.now(); c.running = true; }
      saveGame(g); render(); } break;
    case 'half': if(g){ const c = g.clock;
      if(c.half === 1){ if(await ask('Erste Halbzeit beenden?', 'Halbzeit')){ c.h1End = clockSec(g); c.running = false; c.half = 2; c.elapsed = S.team.halfMin*60; saveGame(g); render(); } }
      else if(await ask('Spiel beenden?', 'Beenden')){ c.elapsed = clockSec(g); c.running = false; g.status = 'done'; saveGame(g); render(); } } break;
    case 'endGame': if(g && await ask('Spiel beenden?', 'Beenden')){ g.clock.elapsed = clockSec(g); g.clock.running = false; g.status = 'done'; saveGame(g); render(); } break;
    case 'reopen': if(g){ g.status = 'live'; saveGame(g); render(); } break;
    case 'scope': S.statsScope = el.dataset.v; render(); break;
    case 'sort': S.sort = el.dataset.v; render(); break;
    case 'gkSort': S.gkSort = el.dataset.v; render(); break;
    case 'playerDetail': S.playerId = id; render(); window.scrollTo(0,0); break;
    case 'backStats': S.playerId = null; render(); break;
  }
});
document.addEventListener('change', ev => {
  const el = ev.target; const a = el.dataset && el.dataset.a;
  if(a === 'keeper'){ const g = S.games[S.gameId]; if(g){ g.keeperId = el.value; doGk(g, el.value || null); } }
  if(a === 'statsGame'){ S.statsGame = el.value; render(); }
});
setInterval(() => {
  if(S.view !== 'live' || !S.gameId) return;
  const g = S.games[S.gameId]; const el = $('#clk');
  if(g && el && g.clock.running){
    el.textContent = fmtClock(clockSec(g));
    const T = playTime(g);
    document.querySelectorAll('[data-pt]').forEach(sp => { const t = T[sp.dataset.pt] || {f:0, g:0}; sp.textContent = fmtMin(t.f + t.g); });
  }
}, 1000);

initStore();
if('serviceWorker' in navigator){ window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(() => {}); }
</script>
</body>
